name: host-lab-ci

on:
  push:
  pull_request:

jobs:
  host-security-model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run host lifecycle tests
        run: python -m unittest tests.test_host_lab -v
      - name: Run host demo
        run: python -m security_lab.host_lab
